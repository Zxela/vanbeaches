name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COAST_MANIFEST_URL: https://vanbeaches-world.alex-zvaniga.workers.dev/world-e14570b34f5918329b77/manifest.json
  COAST_ASSET_ARCHIVE_URL: https://vanbeaches-world.alex-zvaniga.workers.dev/world-e14570b34f5918329b77/coast-web.tar.gz
  COAST_ASSET_ARCHIVE_SHA256: fc67cbe6971a3746addcdb8b644e98e386ff801b58623d092856b3208d99538b

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @van-beaches/shared build

      - name: Build client
        run: pnpm --filter @van-beaches/client build
        env:
          VITE_COAST_MANIFEST_URL: ${{ env.COAST_MANIFEST_URL }}

      - name: Upload shared dist
        uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: shared/dist
          retention-days: 1

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist

      - name: Lint
        run: pnpm check

  typecheck:
    name: Type-check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist

      - name: Type-check
        run: pnpm type-check

      - name: Type-check the independent R2 delivery Worker
        run: pnpm exec tsc -p world-assets/tsconfig.json

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist

      - name: Test
        run: pnpm test

      - name: Test Pages functions and R2 delivery
        run: pnpm exec vitest run --config functions/vitest.config.ts functions world-assets

      - name: Test hosted release identity and independent asset loading
        run: node --test scripts/coast-assets.test.mjs

  e2e:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist

      - name: Install Chromium
        run: pnpm --filter @van-beaches/client exec playwright install --with-deps chromium

      - name: Restore the pinned R2 world for browser tests only
        run: node scripts/coast-assets.mjs prepare

      - name: Verify the restored test world
        run: node scripts/coast-assets.mjs verify

      - name: Run browser tests
        run: pnpm --filter @van-beaches/client exec playwright test --project=chromium --workers=1

      - name: Preserve world acceptance captures and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  deploy:
    name: Deploy
    needs: [lint, typecheck, test, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Create Pages project (if needed)
        run: npx wrangler pages project create vanbeaches --production-branch=master || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify coastal assets before deployment
        run: node scripts/coast-assets.mjs verify client/dist/coast-assets
        env:
          VITE_COAST_MANIFEST_URL: ${{ env.COAST_MANIFEST_URL }}

      - name: Confirm world assets stay outside the app deployment
        run: test ! -d client/dist/coast-assets

      - name: Deploy Pages (preview)
        if: github.event_name == 'pull_request'
        run: npx wrangler pages deploy client/dist --project-name=vanbeaches --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pages (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx wrangler pages deploy client/dist --project-name=vanbeaches --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
